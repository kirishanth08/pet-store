<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin login for PetsMart — manage products, orders, and store settings.">
  <title>Login — PetsMart Pet Shop</title>
  <link rel="canonical" href="https://www.petsmart-store.com/pages/login.html">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icons/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  <script>
    (function() {
      const saved = localStorage.getItem('petshop-theme') || localStorage.getItem('theme');
      const theme = saved || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      if (!saved) {
        localStorage.setItem('petshop-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content">
    <section class="auth-section">
      <div class="container">
        <div class="auth-top-controls">
          <button type="button" class="theme-toggle" aria-label="Switch to dark mode">
            <i class="fas fa-moon" aria-hidden="true"></i>
          </button>
          <button type="button" class="rtl-toggle" aria-label="Switch to RTL layout">
            <i class="fas fa-align-right" aria-hidden="true"></i>
          </button>
        </div>
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7">
            <div class="auth-card">
              <div class="text-center mb-4">
    <a href="index.html" class="auth-logo mb-3">
        <i class="fas fa-paw"></i> PetsMart
    </a>

    <div class="d-flex align-items-center justify-content-center gap-2 flex-wrap mb-2">
        <h1 class="h2 mb-0">Admin Login</h1>
    </div>

    <p class="text-muted mt-3">
        Sign in to manage products, orders, and store settings.
    </p>
</div>

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <div class="d-grid gap-2 mb-3">
                <button type="button" class="btn-pet btn-pet-outline w-100" id="googleSignInBtn">
                  <i class="fab fa-google" aria-hidden="true"></i> Continue with Google
                </button>
                <button type="button" class="btn-pet btn-pet-outline w-100" id="appleSignInBtn">
                  <i class="fab fa-apple" aria-hidden="true"></i> Continue with Apple
                </button>
              </div>

              <!-- Google renders its real (SDK-controlled) button here; our styled
                   button above forwards its click to this one so the design stays
                   consistent while the actual sign-in flow is 100% Google's own code. -->
              <div id="googleRealBtn" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>

              <div class="auth-divider"><span>or sign in with email</span></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="loginEmail" required autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password">
                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="loginPassword" aria-label="Show password">
                      <i class="fas fa-eye-slash" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="loginAgreeTerms" required>
                  <label class="form-check-label" for="loginAgreeTerms">I agree to the Terms of Service and Privacy Policy</label>
                  <div class="invalid-feedback">You must agree before continuing.</div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn-pet btn-pet-primary w-100">
                    <i class="fas fa-right-to-bracket" aria-hidden="true"></i> Log In
                  </button>
                </div>
              </form>

              <p class="text-center mt-4 mb-0 auth-alt-action">
                <span>Don't have an account?</span> <a href="register.html">Sign up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/images.js"></script>
  <script src="../assets/js/auth-config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/auth-ui.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      await PMAuth.ready;

      // If already logged in, bounce straight to the right place
      if (PMAuth.isLoggedIn()) {
        window.location.href = PMAuth.isAdmin() ? 'admin.html' : 'index.html';
        return;
      }

      const googleBtn = document.getElementById('googleSignInBtn');
      const appleBtn = document.getElementById('appleSignInBtn');
      const config = window.PM_AUTH_CONFIG || {};

      const alertBox = document.getElementById('authAlert');

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
      }

      function redirectAfterLogin(user) {
        showAlert(`Welcome, ${user.name}! Redirecting...`, 'success');
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        setTimeout(function () {
          if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = (next && next !== 'login.html') ? next : 'index.html';
          }
        }, 700);
      }

      /* ---------------- Google Sign-In ---------------- */
      let googleReady = false;

      function initGoogle() {
        if (!window.google || !google.accounts || !google.accounts.id) return;
        if (!config.GOOGLE_CLIENT_ID || config.GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE_CLIENT_ID') === 0) return;

        google.accounts.id.initialize({
          client_id: config.GOOGLE_CLIENT_ID,
          callback: async function (response) {
            try {
              const user = await PMAuth.loginWithGoogle(response.credential);
              redirectAfterLogin(user);
            } catch (err) {
              showAlert(err.message, 'danger');
            }
          },
          auto_select: false,
        });
        // Render Google's real, SDK-controlled button off-screen; our styled
        // button forwards clicks to it so the sign-in flow is untouched.
        google.accounts.id.renderButton(document.getElementById('googleRealBtn'), { type: 'standard' });
        googleReady = true;
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', function () {
          if (!config.GOOGLE_CLIENT_ID || config.GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE_CLIENT_ID') === 0) {
            showAlert('Google Sign-In is not configured yet. Add your Client ID in assets/js/auth-config.js.', 'warning');
            return;
          }
          if (!googleReady) {
            showAlert('Google Sign-In is still loading — please try again in a moment.', 'info');
            return;
          }
          const realBtn = document.querySelector('#googleRealBtn div[role="button"]');
          if (realBtn) {
            realBtn.click();
          } else {
            showAlert('Google Sign-In could not start. Please refresh and try again.', 'danger');
          }
        });
      }

      /* ---------------- Apple Sign-In ---------------- */
      let appleReady = false;

      function initApple() {
        if (!window.AppleID) return;
        if (!config.APPLE_CLIENT_ID || config.APPLE_CLIENT_ID.indexOf('YOUR_APPLE_SERVICES_ID') === 0) return;

        AppleID.auth.init({
          clientId: config.APPLE_CLIENT_ID,
          scope: 'name email',
          redirectURI: config.APPLE_REDIRECT_URI,
          usePopup: true,
        });
        appleReady = true;
      }

      if (appleBtn) {
        appleBtn.addEventListener('click', async function () {
          if (!config.APPLE_CLIENT_ID || config.APPLE_CLIENT_ID.indexOf('YOUR_APPLE_SERVICES_ID') === 0) {
            showAlert('Apple Sign-In is not configured yet. Add your Services ID in assets/js/auth-config.js.', 'warning');
            return;
          }
          if (!appleReady) {
            showAlert('Apple Sign-In is still loading — please try again in a moment.', 'info');
            return;
          }
          try {
            const data = await AppleID.auth.signIn();
            const idToken = data && data.authorization && data.authorization.id_token;
            let appleName;
            if (data && data.user && data.user.name) {
              appleName = [data.user.name.firstName, data.user.name.lastName].filter(Boolean).join(' ');
            }
            const user = await PMAuth.loginWithApple(idToken, appleName);
            redirectAfterLogin(user);
          } catch (err) {
            if (err && (err.error === 'popup_closed_by_user' || err.error === 'user_cancelled_authorize')) {
              return;
            }
            showAlert((err && err.message) || 'Apple sign-in failed. Please try again.', 'danger');
          }
        });
      }

      // The Google/Apple SDKs load async — poll briefly until each is ready.
      (function waitForSdks(attemptsLeft) {
        if (attemptsLeft <= 0) return;
        if (!googleReady) initGoogle();
        if (!appleReady) initApple();
        if (!googleReady || !appleReady) {
          setTimeout(function () { waitForSdks(attemptsLeft - 1); }, 300);
        }
      })(20);

      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const agreeTerms = document.getElementById('loginAgreeTerms');

        if (!agreeTerms.checked) {
          agreeTerms.setCustomValidity('required');
          loginForm.classList.add('was-validated');
          return;
        }
        agreeTerms.setCustomValidity('');

        const submitBtn = loginForm.querySelector('button[type="submit"]');
        const originalHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        try {
          const user = await PMAuth.login({ email, password, remember: true });
          showAlert(`Welcome back, ${user.name}! Redirecting...`, 'success');
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          setTimeout(function () {
            if (user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = (next && next !== 'login.html') ? next : 'index.html';
            }
          }, 700);
        } catch (err) {
          showAlert(err.message, 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalHtml;
        }
      });
    });
  </script>
</body>
</html>
